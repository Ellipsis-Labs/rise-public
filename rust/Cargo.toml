[package]
description = "SDK for interacting with Phoenix"
edition = "2021"
homepage = "https://docs.phoenix.trade/"
include = [
  "Cargo.toml",
  "CRATES.md",
  "LICENSE",
  "README.md",
  "examples/**",
  "src/**",
  "test-fixtures/**",
]
license = "MIT"
name = "phoenix-rise"
publish = true
readme = "CRATES.md"
repository = "https://github.com/Ellipsis-Labs/rise-public"
rust-version = "1.84.0"
version = "0.1.13"

[[example]]
name              = "cancel_all_conditional_orders"
required-features = ["solana-keypair"]

[[example]]
name              = "cancel_order"
required-features = ["solana-keypair"]

[[example]]
name              = "cancel_stop_loss"
required-features = ["solana-keypair"]

[[example]]
name              = "deposit_funds"
required-features = ["solana-keypair"]

[[example]]
name              = "delegated_trader_management_onboarding"
required-features = ["solana-keypair"]

[[example]]
name              = "isolated_limit_order"
required-features = ["solana-keypair"]

[[example]]
name              = "isolated_market_order_client"
required-features = ["solana-keypair"]

[[example]]
name              = "isolated_market_order_server"
required-features = ["solana-keypair"]

[[example]]
name              = "market_maker"
required-features = ["solana-keypair"]

[[example]]
name              = "onboard_trader_delegated"
required-features = ["solana-keypair"]

[[example]]
name              = "send_flight_market_order"
required-features = ["solana-keypair"]

[[example]]
name              = "send_limit_order"
required-features = ["solana-keypair"]

[[example]]
name              = "send_market_order"
required-features = ["solana-keypair"]

[[example]]
name              = "subscribe_trader_state"
required-features = ["solana-keypair"]

[dependencies]
async-trait = { version = "0.1", optional = true }
base64 = { version = "0.22", optional = true }
borsh = { version = "1.5", features = ["derive"] }
bs58 = { version = "0.5", optional = true }
bytemuck = { version = "1.21", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"], optional = true }
ed25519-dalek = { version = "2", optional = true }
fixed = "=1.29.0"
futures-util = { version = "0.3", optional = true }
litesvm = { version = "0.7", optional = true }
opentelemetry = { version = "0.31", features = ["trace"], optional = true }
opentelemetry-http = { version = "0.31", optional = true }
parking_lot = { version = "0.12", optional = true }
pastey = "0.1"
rand = { version = "0.10", optional = true }
reqwest = { version = "0.12", default-features = false, features = [
  "json",
  "rustls-tls-webpki-roots",
], optional = true }
rust_decimal = { version = "1.39.0", features = ["serde-str"], optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", optional = true }
serde_urlencoded = { version = "0.7", optional = true }
serde_with = { version = "3.12", optional = true }
sha2 = "0.10"
sha2-const-stable = "0.1"
solana-commitment-config = { version = "~2.2", optional = true }
solana-compute-budget-interface = { version = "~2.2", optional = true }
solana-instruction = { version = "~2.3", default-features = false, features = [
  "std",
] }
solana-keypair = { version = "~2.2", optional = true }
solana-pubkey = { version = "~2.4", features = ["curve25519"] }
solana-rpc-client = { version = "~2.3", optional = true }
solana-rpc-client-api = { version = "~2.3", optional = true }
solana-signer = { version = "~2.2", optional = true }
solana-transaction = { version = "~2.2", optional = true }
solana-transaction-error = { version = "~2.2", optional = true }
solana-transaction-status-client-types = { version = "~2.3", optional = true }
thiserror = "2.0"
tokio = { version = "1.44", features = [
  "sync",
  "rt-multi-thread",
  "macros",
  "time",
  "test-util",
], optional = true }
tokio-stream = { version = "0.1", optional = true }
tokio-tungstenite = { version = "0.26", default-features = false, features = [
  "connect",
  "rustls-tls-webpki-roots",
], optional = true }
tracing = { version = "0.1", features = ["log"], optional = true }
tracing-opentelemetry = { version = "0.32", optional = true }
url = { version = "2.5", optional = true }
utoipa = { version = "5.4", features = ["chrono"], optional = true }

[dev-dependencies]
axum                            = "0.8"
litesvm                         = "0.7"
opentelemetry_sdk               = { version = "0.31", features = ["trace"] }
proptest                        = "1.11.0"
rand                            = "0.10.1"
solana-commitment-config        = "~2.2"
solana-compute-budget-interface = "~2.2"
solana-keypair                  = "~2.2"
solana-signer                   = "~2.2"
solana-transaction              = "~2.2"
toml                            = "0.8"
tracing-subscriber              = { version = "0.3", features = ["env-filter"] }

[workspace]
members  = ["cli"]
resolver = "2"

[workspace.package]
description  = "SDK for interacting with Phoenix"
edition      = "2024"
homepage     = "https://docs.phoenix.trade/"
license      = "MIT"
publish      = true
readme       = "CRATES.md"
repository   = "https://github.com/Ellipsis-Labs/rise-public"
rust-version = "1.89.0"
version      = "0.1.13"

[workspace.dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
solana-keypair = "~2.2"
solana-pubkey = { version = "~2.4", features = ["curve25519"] }
tokio = { version = "1.44", features = [
  "sync",
  "rt-multi-thread",
  "macros",
  "time",
  "test-util",
] }
url = "2.5"

[profile.ci]
inherits = "dev"
# Full debug in CI builds is unnecessary and makes cache artifacts large.
debug = "line-tables-only"

[lints.rust.unexpected_cfgs]
check-cfg = ['cfg(target_os, values("solana"))', 'cfg(tokio_unstable)']
level     = "allow"

[lints.clippy]
uninlined_format_args = "allow"

[features]
default = ["sdk"]
ed25519-dalek = ["sdk", "dep:ed25519-dalek"]
opentelemetry = [
  "sdk",
  "dep:opentelemetry",
  "dep:opentelemetry-http",
  "dep:tracing-opentelemetry",
]
rust_decimal = ["dep:rust_decimal"]
sdk = [
  "types",
  "dep:async-trait",
  "dep:base64",
  "dep:bs58",
  "dep:futures-util",
  "dep:parking_lot",
  "dep:rand",
  "dep:reqwest",
  "dep:serde_urlencoded",
  "dep:solana-compute-budget-interface",
  "dep:solana-rpc-client",
  "dep:solana-rpc-client-api",
  "dep:solana-transaction",
  "dep:solana-transaction-error",
  "dep:solana-transaction-status-client-types",
  "dep:tokio-stream",
]
solana-keypair = ["dep:solana-keypair", "dep:solana-signer"]
test-fixture = [
  "types",
  "solana-keypair",
  "dep:base64",
  "dep:litesvm",
  "dep:solana-commitment-config",
  "dep:solana-rpc-client",
  "dep:solana-transaction",
]
types = [
  "rust_decimal",
  "dep:chrono",
  "dep:reqwest",
  "dep:serde_json",
  "dep:serde_with",
  "dep:tokio",
  "dep:tokio-tungstenite",
  "dep:tracing",
  "dep:url",
]
utoipa = ["types", "dep:utoipa"]

[package.metadata.cargo-machete]
ignored = [
  "borsh",
  "bytemuck",
  "fixed",
  "pastey",
  "proptest",
  "rand",
  "serde_with",
  "sha2",
  "sha2-const-stable",
  "litesvm",
  "utoipa",
]
