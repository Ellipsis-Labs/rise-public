[workspace]
members = [
  "accounts",
  "core",
  "events",
  "ix",
  "math",
  "types",
  "api",
  "litesvm-test",
  "sdk",
  "cli",
]
resolver = "2"

[workspace.package]
description  = "SDK for interacting with Phoenix"
edition      = "2024"
homepage     = "https://docs.phoenix.trade/"
license      = "MIT"
publish      = true
readme       = "CRATES.md"
repository   = "https://github.com/Ellipsis-Labs/rise-public"
rust-version = "1.89.0"
version      = "0.3.0"

[workspace.metadata.workspace-lints]
feature-exceptions = [
  "phoenix-rise",
  "phoenix-rise-ix",
  "phoenix-rise-math",
  "phoenix-rise-types",
]
workspace-package-publish = true
workspace-package-version = "0.3.0"

[workspace.dependencies]
async-trait = "0.1"
axum = { version = "0.8.3", features = ["http1"] }
base64 = "0.22"
bincode = "1.3.3"
borsh = { version = "1.5", features = ["derive"] }
bs58 = "0.5"
bytemuck = { version = "1.21", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
ed25519-dalek = "2"
fixed = "=1.29.0"
futures-util = "0.3"
litesvm = "=0.11.0"
opentelemetry = { version = "0.31", features = ["trace"] }
opentelemetry-http = "0.31"
opentelemetry_sdk = { version = "0.31", features = ["trace"] }
parking_lot = "0.12"
pastey = "0.1"
phoenix-rise = { path = "sdk", version = "=0.3.0", default-features = false }
phoenix-rise-accounts = { path = "accounts", version = "=0.3.0", default-features = false }
phoenix-rise-api = { path = "api", version = "=0.3.0", default-features = false }
phoenix-rise-core = { path = "core", version = "=0.3.0", default-features = false }
phoenix-rise-events = { path = "events", version = "=0.3.0", default-features = false }
phoenix-rise-ix = { path = "ix", version = "=0.3.0", default-features = false }
phoenix-rise-math = { path = "math", version = "=0.3.0", default-features = false }
phoenix-rise-types = { path = "types", version = "=0.3.0", default-features = false }
pinocchio = "0.9.2"
proptest = "1.11.0"
rand = "0.10"
reqwest = { version = "0.12", default-features = false, features = [
  "json",
  "rustls-tls-webpki-roots",
] }
rust_decimal = { version = "1.39.0", features = ["serde-str"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_urlencoded = "0.7"
serde_with = "3.12"
sha2 = "0.10"
sha2-const-stable = "0.1"
solana-commitment-config = "~3.1"
solana-compute-budget-interface = "~3.0"
solana-instruction = { version = "~3.0", default-features = false, features = [
  "std",
] }
solana-keypair = "~3.1"
solana-message = "~3.1"
solana-pubkey = { version = "~3.0", features = [
  "borsh",
  "curve25519",
  "serde",
] }
solana-rpc-client = "~3.1"
solana-rpc-client-api = "~3.1"
solana-signature = "~3.2"
solana-signer = "~3.0"
solana-transaction = "~3.1"
solana-transaction-error = "~3.0"
solana-transaction-status-client-types = "~3.1"
thiserror = "2.0"
tokio = { version = "1.44", features = [
  "sync",
  "rt-multi-thread",
  "macros",
  "time",
  "test-util",
  "net",
  "signal",
] }
tokio-stream = "0.1"
tokio-tungstenite = { version = "0.26", default-features = false, features = [
  "connect",
  "rustls-tls-webpki-roots",
] }
toml = "0.8"
tracing = { version = "0.1", features = ["log"] }
tracing-opentelemetry = "0.32"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2.5"
utoipa = { version = "5.4", features = ["chrono"] }

[profile.ci]
debug    = "line-tables-only"
inherits = "dev"
