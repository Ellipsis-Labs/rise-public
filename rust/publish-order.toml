# Publishable Rust workspace crates in dependency order.
#
# Keep this list explicit. The release scripts validate it against
# `cargo metadata` so adding a crate or changing internal dependencies requires
# updating this graph before CI can publish.
#
# Entries that are not present in the current workspace are ignored. This lets
# the public release repo stage the split-crate order before every crate exists
# in `rust/`.
crates = [
  "phoenix-rise-math",
  "phoenix-rise-types",
  "phoenix-rise-accounts",
  "phoenix-rise-events",
  "phoenix-rise-ix",
  "phoenix-rise-api",
  "phoenix-rise-core",
  "phoenix-rise-litesvm-test",
  "phoenix-rise",
  "phoenix-rise-cli",
]
