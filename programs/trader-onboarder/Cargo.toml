[package]
edition      = "2024"
name         = "rise-trader-onboarder"
publish      = false
rust-version = "1.89.0"
version      = "0.1.0"

[lib]
crate-type = ["cdylib", "lib"]
test       = false

[dependencies]
borsh = { version = "=1.6.0", features = ["derive"] }
borsh-derive = "=1.6.0"
phoenix-rise = { path = "../../rust", default-features = false }
pinocchio = "0.9.2"
pinocchio-pubkey = "0.3.0"
proc-macro-crate = "=3.4.0"
sha2 = "0.10"
sha2-const-stable = "0.1"
solana-instruction = { version = "~2.3", default-features = false, features = [
  "std",
] }
solana-pubkey = { version = "~2.4", features = ["curve25519"] }
toml_parser = "=1.0.6"
zeroize = "=1.8.2"

[dev-dependencies]
phoenix-rise = { path = "../../rust", default-features = false, features = [
  "test-fixture",
] }
solana-instruction = { version = "~2.3", default-features = false, features = [
  "std",
] }
solana-pubkey = { version = "~2.4", features = ["curve25519"] }
solana-transaction-error = "~2.2"

[profile.ci]
inherits = "dev"
# Full debug in CI builds is unnecessary and makes cache artifacts large.
debug = "line-tables-only"

[lints.rust.unexpected_cfgs]
check-cfg = ['cfg(target_os, values("solana"))']
level     = "allow"
