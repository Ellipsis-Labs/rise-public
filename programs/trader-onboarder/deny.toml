[licenses]
allow = [
  "0BSD",
  "Apache-2.0 WITH LLVM-exception",
  "Apache-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "LGPL-2.1",
  "LGPL-3.0",
  "MIT",
  "MPL-2.0",
  "OpenSSL",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]
confidence-threshold = 0.95
private = { ignore = true }
unused-allowed-license = "allow"

[[licenses.clarify]]
expression    = "MIT AND ISC AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]
name          = "ring"

[advisories]
ignore = [
  # Temporary transitive exception: Solana's elliptic-curve 0.13 requires
  # crypto-bigint ^0.5; the fix requires >=0.7.6, outside that version range.
  # Remove this when these parents support a patched crypto-bigint release.
  "RUSTSEC-2026-0387", # crypto-bigint - timing variability
  # Temporary transitive exceptions: Solana account decoders and Tonic require
  # zstd ^0.13, which requires zstd-safe ^7. Fixes require zstd >=0.14.3 and
  # zstd-safe >=8.2.0. Remove these when upstream consumers support those versions.
  "RUSTSEC-2026-0391", # zstd - abandoned stream data leaks through a reused context
  "RUSTSEC-2026-0395", # zstd-safe - StableInBuffer use-after-free
  "RUSTSEC-2026-0396", # zstd-safe - invalid seek table reads
  "RUSTSEC-2026-0397", # zstd-safe - OutBuffer::around_pos exposes uninitialized memory
  "RUSTSEC-2026-0398", # zstd-safe - seekable decompression exceeds Vec capacity
  "RUSTSEC-2026-0399", # zstd-safe - borrowed dictionary use-after-free
  "RUSTSEC-2026-0400", # zstd-safe - mixed streaming/one-shot dictionary use-after-free
  "RUSTSEC-2026-0401", # zstd-safe - dictionary training sample-size overflow
  "RUSTSEC-2026-0402", # zstd-safe - multithreaded CCtx::try_clone buffer overflow
  "RUSTSEC-2026-0403", # zstd-safe - legacy frame errors expose uninitialized memory
  "RUSTSEC-2026-0404", # zstd-safe - DCtx::try_clone double free
  "RUSTSEC-2026-0405", # zstd-safe - out-of-range InBuffer::pos read
  "RUSTSEC-2026-0406", # zstd-safe - unfinished multithreaded frame use-after-free
  "RUSTSEC-2021-0145", # atty - unaligned read (transitive dependency)
  "RUSTSEC-2022-0093", # ed25519-dalek - double public key signing (transitive dependency)
  "RUSTSEC-2024-0344", # curve25519-dalek - timing variability (transitive dependency)
  "RUSTSEC-2025-0119", # number_prefix - unmaintained (transitive via Solana RPC indicatif)
  "RUSTSEC-2025-0141", # bincode - unmaintained (team considers 1.3.3 complete)
  "RUSTSEC-2026-0049",
  "RUSTSEC-2026-0097", # rand advisory accepted for now
  "RUSTSEC-2026-0098", # rustls-webpki URI name constraints issue; transitive via rustls stack
  "RUSTSEC-2026-0099", # rustls-webpki wildcard name constraints issue; transitive via rustls stack
  "RUSTSEC-2026-0186", # memmap2 0.5.10 forced by Solana 2.x solana-genesis-config; no compatible 0.9.x upgrade available
]
unmaintained = 'workspace'
