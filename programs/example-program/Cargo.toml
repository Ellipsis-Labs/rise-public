[package]
edition      = "2021"
name         = "rise-example-program"
publish      = false
rust-version = "1.84.0"
version      = "0.1.0"

[lib]
crate-type = ["cdylib", "lib"]
test       = false

[dependencies]
borsh = { version = "=1.6.0", features = ["derive"] }
borsh-derive = "=1.6.0"
indexmap = "=2.13.0"
phoenix-rise = { path = "../../rust/sdk", default-features = false, features = [
  "cpi",
] }
pinocchio = "0.9.2"
pinocchio-pubkey = "0.3.0"
proc-macro-crate = "=3.4.0"
sha2 = "0.10"
sha2-const-stable = "0.1"
solana-pubkey = { version = "~2.4", default-features = false }
toml_parser = "=1.0.6"
zeroize = "=1.8.2"

[dev-dependencies]
phoenix-rise = { path = "../../rust/sdk", default-features = false, features = [
  "core",
] }
phoenix-rise-litesvm-test = { path = "../../rust/litesvm-test" }
solana-compute-budget-interface = "~2.2"
solana-instruction = { version = "~2.3", default-features = false, features = [
  "std",
] }
solana-pubkey = { version = "~2.4", default-features = false, features = [
  "curve25519",
] }

[profile.ci]
inherits = "dev"
# Full debug in CI builds is unnecessary and makes cache artifacts large.
debug = "line-tables-only"

[lints.rust.unexpected_cfgs]
check-cfg = ['cfg(target_os, values("solana"))']
level     = "allow"
