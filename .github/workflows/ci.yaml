name: Rise CI

on:
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.changed.outputs.rust }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect changed paths
        id: changed
        run: |
          set -euo pipefail
          git fetch origin "${GITHUB_BASE_REF}" --prune
          changed_paths="$(git diff --name-only "origin/${GITHUB_BASE_REF}" HEAD)"

          rust=false
          if grep -Eq '^rust/' <<<"${changed_paths}"; then
            rust=true
          fi

          echo "rust=${rust}" >> "${GITHUB_OUTPUT}"
          printf '%s\n' "${changed_paths}"

  release-order:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v7

      - name: Validate release order
        run: |
          set -euo pipefail
          git fetch origin "${GITHUB_BASE_REF}" --prune
          uv run --script scripts/validate_release_order.py \
            --base-ref "origin/${GITHUB_BASE_REF}" \
            --head-ref HEAD \
            --head-branch "${GITHUB_HEAD_REF}"

  typescript:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ts
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type-check
        run: bun run check

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build

  rust:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7

      - name: Install Rust toolchain
        run: rustup toolchain install 1.91.1 --profile minimal

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Check Rust workspace
        run: uv run --script scripts/rust_publish.py ci --toolchain 1.91.1
