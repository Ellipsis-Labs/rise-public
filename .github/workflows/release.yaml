name: Rise Release

on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run the release workflow without uploading packages."
        default: "true"
        required: true
        type: choice
        options:
          - "true"
          - "false"
      package:
        description: "Package scope to publish."
        default: "changed"
        required: true
        type: choice
        options:
          - "changed"
          - "typescript"
          - "rust"

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.plan.outputs.should_release }}
      package_key: ${{ steps.plan.outputs.package_key }}
      package_scope: ${{ steps.plan.outputs.package_scope }}
      release_tag: ${{ steps.plan.outputs.release_tag }}
      release_title: ${{ steps.plan.outputs.release_title }}
      rust_name: ${{ steps.plan.outputs.rust_name }}
      rust_version: ${{ steps.plan.outputs.rust_version }}
      ts_name: ${{ steps.plan.outputs.ts_name }}
      ts_version: ${{ steps.plan.outputs.ts_version }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - uses: astral-sh/setup-uv@v7

      - name: Plan release
        id: plan
        env:
          PACKAGE_SCOPE: ${{ inputs.package || 'changed' }}
        run: uv run --script scripts/release_plan.py --package "${PACKAGE_SCOPE}"

  publish-typescript:
    needs: plan
    if: needs.plan.outputs.should_release == 'true' && needs.plan.outputs.package_key == 'ts'
    runs-on: ubuntu-latest
    outputs:
      package_published: ${{ steps.publish-state.outputs.package_published }}
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: ts
    env:
      DRY_RUN: ${{ inputs.dry_run || 'false' }}
      NPM_PUBLISH_ACCESS: ${{ vars.NPM_PUBLISH_ACCESS || 'public' }}
      NPM_REGISTRY_URL: ${{ vars.NPM_REGISTRY_URL || 'https://registry.npmjs.org' }}
      PUBLISH_ENABLED: ${{ vars.RISE_RELEASE_PUBLISH_ENABLED || 'false' }}
      TS_NAME: ${{ needs.plan.outputs.ts_name }}
      TS_VERSION: ${{ needs.plan.outputs.ts_version }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"

      - name: Configure npm registry
        run: |
          set -euo pipefail
          printf 'registry=%s\n@ellipsis-labs:registry=%s\n' \
            "${NPM_REGISTRY_URL}" \
            "${NPM_REGISTRY_URL}" > .npmrc

      - name: Check npm version
        id: npm-status
        run: |
          set -euo pipefail
          package_ref="${TS_NAME}@${TS_VERSION}"
          output_file="$(mktemp)"
          error_file="$(mktemp)"
          trap 'rm -f "${output_file}" "${error_file}"' EXIT

          if npm view "${package_ref}" version \
            --registry "${NPM_REGISTRY_URL}" >"${output_file}" 2>"${error_file}"; then
            echo "publish=false" >> "${GITHUB_OUTPUT}"
            echo "${package_ref} is already published"
            exit 0
          fi

          registry_output="$(cat "${error_file}" "${output_file}" | tr '[:upper:]' '[:lower:]')"
          if grep -Eq 'e404|404 not found|is not in the npm registry|does not exist in this registry|no version of' <<<"${registry_output}"; then
            echo "publish=true" >> "${GITHUB_OUTPUT}"
            echo "${package_ref} is not yet published"
            exit 0
          fi

          cat "${error_file}" >&2
          cat "${output_file}" >&2
          exit 1

      - name: Install dependencies
        if: steps.npm-status.outputs.publish == 'true'
        run: bun install --frozen-lockfile

      - name: Type-check
        if: steps.npm-status.outputs.publish == 'true'
        run: bun run check

      - name: Test
        if: steps.npm-status.outputs.publish == 'true'
        run: bun run test

      - name: Build
        if: steps.npm-status.outputs.publish == 'true'
        run: bun run build

      - name: Publish npm package
        if: >
          steps.npm-status.outputs.publish == 'true' &&
          (env.DRY_RUN == 'true' || env.PUBLISH_ENABLED == 'true')
        run: |
          set -euo pipefail
          args=(
            --registry "${NPM_REGISTRY_URL}"
            --access "${NPM_PUBLISH_ACCESS}"
            --provenance
          )
          if [[ "${DRY_RUN}" == "true" ]]; then
            args+=(--dry-run)
          fi
          npm publish "${args[@]}"

      - name: Report disabled npm publish
        if: >
          steps.npm-status.outputs.publish == 'true' &&
          env.DRY_RUN != 'true' &&
          env.PUBLISH_ENABLED != 'true'
        run: echo "RISE_RELEASE_PUBLISH_ENABLED is not true; skipping npm publish"

      - name: Report npm publish result
        id: publish-state
        if: always()
        env:
          PACKAGE_NEEDS_PUBLISH: ${{ steps.npm-status.outputs.publish || 'false' }}
        run: |
          if [[ "${PACKAGE_NEEDS_PUBLISH}" == "true" && "${DRY_RUN}" != "true" && "${PUBLISH_ENABLED}" == "true" ]]; then
            echo "package_published=true" >> "${GITHUB_OUTPUT}"
          else
            echo "package_published=false" >> "${GITHUB_OUTPUT}"
          fi

  publish-rust:
    needs: plan
    if: needs.plan.outputs.should_release == 'true' && needs.plan.outputs.package_key == 'rust'
    runs-on: ubuntu-latest
    outputs:
      package_published: ${{ steps.publish-state.outputs.package_published }}
      release_ready: ${{ steps.publish-state.outputs.release_ready }}
    permissions:
      contents: read
      id-token: write
    env:
      DRY_RUN: ${{ inputs.dry_run || 'false' }}
      PUBLISH_ENABLED: ${{ vars.RISE_RELEASE_PUBLISH_ENABLED || 'false' }}
      RUST_VERSION: ${{ needs.plan.outputs.rust_version }}
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7

      - name: Install Rust toolchain
        run: rustup toolchain install 1.91.1 --profile minimal

      - name: Validate Rust publish order
        run: uv run --script scripts/rust_publish.py validate --toolchain 1.91.1 --expected-version "${RUST_VERSION}"

      - name: Plan crates.io publishes
        id: crate-status
        run: uv run --script scripts/rust_publish.py plan --toolchain 1.91.1 --expected-version "${RUST_VERSION}"

      - name: Package publishable Rust crates
        if: steps.crate-status.outputs.publish_required == 'true'
        run: uv run --script scripts/rust_publish.py package --toolchain 1.91.1 --expected-version "${RUST_VERSION}"

      - name: Authenticate to crates.io
        if: >
          steps.crate-status.outputs.publish_required == 'true' &&
          env.DRY_RUN != 'true' &&
          env.PUBLISH_ENABLED == 'true'
        id: cargo-auth
        uses: rust-lang/crates-io-auth-action@v1

      - name: Publish missing Rust crates
        id: publish-crates
        if: >
          steps.crate-status.outputs.publish_required == 'true' &&
          (env.DRY_RUN == 'true' || env.PUBLISH_ENABLED == 'true')
        run: |
          set -euo pipefail
          args=(publish --toolchain 1.91.1 --expected-version "${RUST_VERSION}")
          if [[ "${DRY_RUN}" == "true" ]]; then
            args+=(--dry-run)
          fi
          uv run --script scripts/rust_publish.py "${args[@]}"
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.cargo-auth.outputs.token }}

      - name: Report disabled crate publish
        if: >
          steps.crate-status.outputs.publish_required == 'true' &&
          env.DRY_RUN != 'true' &&
          env.PUBLISH_ENABLED != 'true'
        run: echo "RISE_RELEASE_PUBLISH_ENABLED is not true; skipping crates.io publish"

      - name: Confirm crates.io publish state
        id: final-status
        if: >
          always() &&
          steps.crate-status.outcome == 'success' &&
          env.DRY_RUN != 'true' &&
          env.PUBLISH_ENABLED == 'true'
        run: uv run --script scripts/rust_publish.py plan --toolchain 1.91.1 --expected-version "${RUST_VERSION}"

      - name: Report crate publish result
        id: publish-state
        if: always()
        env:
          ALL_PUBLISHED: ${{ steps.final-status.outputs.all_published || steps.publish-crates.outputs.all_published || steps.crate-status.outputs.all_published || 'false' }}
          PUBLISHED_ANY: ${{ steps.publish-crates.outputs.published_any || 'false' }}
        run: |
          if [[ "${PUBLISHED_ANY}" == "true" && "${DRY_RUN}" != "true" && "${PUBLISH_ENABLED}" == "true" ]]; then
            echo "package_published=true" >> "${GITHUB_OUTPUT}"
          else
            echo "package_published=false" >> "${GITHUB_OUTPUT}"
          fi

          if [[ "${ALL_PUBLISHED}" == "true" && "${DRY_RUN}" != "true" && "${PUBLISH_ENABLED}" == "true" ]]; then
            echo "release_ready=true" >> "${GITHUB_OUTPUT}"
          else
            echo "release_ready=false" >> "${GITHUB_OUTPUT}"
          fi

  release:
    needs:
      - plan
      - publish-typescript
      - publish-rust
    if: |
      always()
      && needs.plan.result == 'success'
      && needs.plan.outputs.should_release == 'true'
      && (needs.publish-typescript.result == 'success' || needs.publish-typescript.result == 'skipped')
      && (needs.publish-rust.result == 'success' || needs.publish-rust.result == 'skipped')
      && (needs.publish-typescript.outputs.package_published == 'true' || needs.publish-rust.outputs.release_ready == 'true')
      && vars.RISE_RELEASE_PUBLISH_ENABLED == 'true'
      && (github.event_name != 'workflow_dispatch' || inputs.dry_run == 'false')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      PACKAGE_SCOPE: ${{ needs.plan.outputs.package_scope }}
      RELEASE_TAG: ${{ needs.plan.outputs.release_tag }}
      RELEASE_TITLE: ${{ needs.plan.outputs.release_title }}
      RISE_RELEASE_SLACK_WEBHOOK_CONFIGURED: ${{ secrets.RISE_RELEASE_SLACK_WEBHOOK_URL != '' }}
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7

      - name: Build release notes
        run: uv run --script scripts/release_plan.py --package "${PACKAGE_SCOPE}" --release-notes release-notes.md

      - name: Create GitHub release
        run: |
          set -euo pipefail
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "Release ${RELEASE_TAG} already exists"
            exit 0
          fi

          gh release create "${RELEASE_TAG}" \
            --target "${GITHUB_SHA}" \
            --title "${RELEASE_TITLE}" \
            --notes-file release-notes.md

      - name: Collect release PR metadata
        id: release-pr
        if: env.RISE_RELEASE_SLACK_WEBHOOK_CONFIGURED == 'true'
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import subprocess

          def write_output(key, value):
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
                  handle.write(f"{key}={value}\n")

          def gh_api(path):
              result = subprocess.run(
                  [
                      "gh",
                      "api",
                      "-H",
                      "Accept: application/vnd.github+json",
                      path,
                  ],
                  check=False,
                  capture_output=True,
                  text=True,
              )
              if result.returncode != 0:
                  print(result.stderr.strip() or result.stdout.strip())
                  return None
              return json.loads(result.stdout)

          repo = os.environ["GITHUB_REPOSITORY"]
          sha = os.environ["GITHUB_SHA"]
          prs = gh_api(f"/repos/{repo}/commits/{sha}/pulls") or []
          merged_prs = [pr for pr in prs if pr.get("merged_at")]
          pr = merged_prs[0] if merged_prs else (prs[0] if prs else None)
          if pr is None:
              write_output("pr_number", "")
              write_output("pr_url", "")
              write_output("stamped_by", "")
              write_output("merged_by", os.environ.get("GITHUB_ACTOR", ""))
              raise SystemExit(0)

          pr_number = str(pr["number"])
          pr_details = gh_api(f"/repos/{repo}/pulls/{pr_number}") or pr
          reviews = gh_api(f"/repos/{repo}/pulls/{pr_number}/reviews") or []
          approvals = [
              review
              for review in reviews
              if review.get("state") == "APPROVED" and review.get("user")
          ]
          stamped_by = approvals[-1]["user"]["login"] if approvals else ""
          merged_by = (
              (pr_details.get("merged_by") or {}).get("login")
              or os.environ.get("GITHUB_ACTOR", "")
          )

          write_output("pr_number", pr_number)
          write_output("pr_url", pr_details.get("html_url") or pr.get("html_url") or "")
          write_output("stamped_by", stamped_by)
          write_output("merged_by", merged_by)
          PY

      - name: Notify Slack
        if: env.RISE_RELEASE_SLACK_WEBHOOK_CONFIGURED == 'true'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.RISE_RELEASE_SLACK_WEBHOOK_URL }}
          RELEASE_PR_NUMBER: ${{ steps.release-pr.outputs.pr_number }}
          RELEASE_PR_URL: ${{ steps.release-pr.outputs.pr_url }}
          RELEASE_STAMPED_BY: ${{ steps.release-pr.outputs.stamped_by }}
          RELEASE_MERGED_BY: ${{ steps.release-pr.outputs.merged_by }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          release_title = os.environ["RELEASE_TITLE"]
          release_tag = os.environ["RELEASE_TAG"]
          release_url = (
              f"https://github.com/{os.environ['GITHUB_REPOSITORY']}"
              f"/releases/tag/{release_tag}"
          )
          release_notes = Path("release-notes.md").read_text(encoding="utf-8").strip()
          title_heading = f"# {release_title}"
          if release_notes.startswith(title_heading):
              release_notes = release_notes[len(title_heading):].strip()

          metadata = []
          if os.environ.get("RELEASE_PR_NUMBER") and os.environ.get("RELEASE_PR_URL"):
              metadata.append(
                  f"*PR:* <{os.environ['RELEASE_PR_URL']}|#{os.environ['RELEASE_PR_NUMBER']}>"
              )
          if os.environ.get("RELEASE_STAMPED_BY"):
              metadata.append(f"*Stamped by:* @{os.environ['RELEASE_STAMPED_BY']}")
          if os.environ.get("RELEASE_MERGED_BY"):
              metadata.append(f"*Merged by:* @{os.environ['RELEASE_MERGED_BY']}")

          body_parts = []
          if metadata:
              body_parts.append("\n".join(metadata))
          if release_notes:
              body_parts.append(release_notes)

          payload = {
              "text": f"*<{release_url}|{release_title}>*\n\n" + "\n\n".join(body_parts),
          }
          Path("slack-payload.json").write_text(
              json.dumps(payload, ensure_ascii=False) + "\n",
              encoding="utf-8",
          )
          PY

          curl --fail-with-body -sS \
            -X POST \
            -H 'Content-Type: application/json' \
            --data @slack-payload.json \
            "${SLACK_WEBHOOK_URL}"
